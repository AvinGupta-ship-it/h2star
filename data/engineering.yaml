name: "H2STAR reference pressure vessel"
description: "Engineering parameters for the thin-wall composite vessel mass model (src/h2star/vessel.py): composite-overwrapped, aluminum-lined, ~100 bar cryo-adsorption reference envelope. Values are stored in SI directly; each _source field records the source-native value and the conversion arithmetic (unlike ax21.yaml, which keeps native units and converts in code)."
date_accessed: "2026-08-17"
vessel:            # wall sized by t = SF*P_max*r/sigma_allow; shell mass = area*t*composite_density + area*liner_areal_mass; PF is the mass cross-check only
     safety_factor: {value: 2.25, unit: "dimensionless"}    # SF; the ONLY margin in this model
     safety_factor_source: "Regulatory-style burst-ratio safety factor specified in H2STAR manual 3.4G; corroborated by Hua et al. ANL-10/24 (2010) Table 1, which applies SF = 2.25 to the nominal storage pressure."
     sigma_allow: {value: 1.836e+9, unit: "Pa"}              # EFFECTIVE composite stress; SF applied SEPARATELY in code; do not re-apply knockdowns
     sigma_allow_source: "Hua, Ahluwalia, Peng et al., Technical Assessment of Compressed Hydrogen Storage Tank Systems for Automotive Applications, ANL-10/24 (Argonne/TIAX, 2010), Table 1 (report p.9 / PDF p.11): CF composite tensile strength 2550 MPa (Toray T700S, 60 vol% fiber), CF quality adjustment -10%, CF translation efficiency 80.0% at 700 bar. Effective = 2550 * 0.90 * 0.80 = 1836 MPa = 1.836e+9 Pa. Composite base strength with manufacturing knockdowns folded in; NOT a raw fiber UTS and NOT a value already containing the 2.25 safety factor."
     aspect_ratio_LR: {value: 3.0, unit: "dimensionless"}   # cylindrical-section length / radius, for a capsule (cylinder + 2 hemispherical caps)
     aspect_ratio_LR_source: "Design assumption (H2STAR). Mild capsule aspect ratio representative of automotive composite-overwrapped pressure vessels; no repo default existed. Chosen to make vessel geometry data-driven; vessel mass is weakly sensitive to LR and the generous vessel-model uncertainty (manual 3.3, FM4) covers the choice."
     composite_density: {value: 1609, unit: "kg/m3"}        # effective CFRP overwrap density = overwrap mass / overwrap volume
     composite_density_source: "Hua et al., ANL-10/24 (2010), Appendix A, 700-bar one-tank case (PDF p.37): wound CF/epoxy structural layer mass 67.4 kg, volume 41.9 L. 67.4 / 0.0419 = 1609 kg/m3. CF/epoxy volume fractions 0.6/0.4 and mass fractions 68/32 (PDF p.52) confirm impregnated composite, not bare fiber."
     liner_areal_mass: {value: 4.667, unit: "kg/m2"}        # aluminum (Type III) liner mass per unit shell area, scaled to the ~100 bar design pressure
     liner_areal_mass_source: "Source thickness is a 700-bar Type III Al 6061-T6 liner: Hua et al., ANL-10/24 (2010), Table 1 / Type III discussion, 12.1 mm; Al 6061 density 2700 kg/m3 (Kaiser Aluminum, Technical Data Rod & Bar Alloy 6061, rev KA-RBH-6061-8.10). Full-pressure areal mass = 0.0121 * 2700 = 32.67 kg/m2 at 700 bar. A metallic liner is a gas barrier and partial load-sharer whose thickness scales ~linearly with design pressure, so it is scaled to the H2STAR ~100 bar envelope: 32.67 * (100/700) = 4.667 kg/m2. Carrying the unscaled 700-bar liner into a 100-bar vessel is a wrong-design-pressure error, not a conservative choice."
     performance_factor: {value: 73500, unit: "Pa*m3/kg"}   # = J/kg; CROSS-CHECK benchmark only (m_check = P_max*V/PF), never a sizing input
     performance_factor_source: "Newhouse, Development of Improved Composite Pressure Vessels for Hydrogen Storage, Hexagon Lincoln / DOE H2 and Fuel Cells Annual Merit Review, Project ST047 (14 May 2013), slide 14, Tank 5: Type IV carbon composite (T700/epoxy/HDPE), 100 bar, 60 L, 8.16 kg -> PV/W = 735 bar*L/kg. 735 * 100 = 73500 J/kg = 7.35e4 Pa*m3/kg (1 bar*L = 100 J)."
notes: >
     Class framing. H2STAR's vessel is a ~100 bar cryo-adsorption composite-overwrapped
     tank, not a 700 bar automotive tank. sigma_allow and composite_density are material
     properties of T700/epoxy, taken as vessel-class-independent. The liner is an aluminum
     (Type III) term per manual 3.4G, scaled from its 700-bar source thickness to the
     ~100 bar envelope. PF is the closest directly published PV/m benchmark, a 100 bar
     Type IV HSECoE vessel, used ONLY for the two-estimate mass cross-check (manual 3.14
     FM4), never as a sizing input or a 700 bar calibration.

     sigma_allow choice. Effective composite stress (1.836 GPa) folds Argonne's 10% quality
     and 80% translation-efficiency knockdowns into the stress, with SF = 2.25 the sole
     separate margin. Base composite strength (2.550 GPa) is recorded in sigma_allow_source.
     Do not re-apply the 0.90 or 0.80 factors in code, and do not fold 2.25 into sigma_allow.

     Cross-check caveat. The hoop-stress route (aluminum-lined Type III, liner scaled to
     100 bar) and the PF benchmark (plastic-lined Type IV) are slightly different vessel
     classes; the ~35% agreement band and the generous vessel-model uncertainty (manual
     3.3, FM4) absorb that gap.