name: CI

on: push

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check .
      - name: Run tests
        run: pytest

  # The matrix above always resolves the newest Matplotlib, so every job in it
  # shares one rendering stack -- and so did all four clean-room runs, which is
  # why none of them caught that the recorded figure configuration raised on
  # any other Matplotlib. Of its 324 settings, 3.9.4 rejects 26, and applying
  # them unfiltered broke every plotting call in the package. This job pins an
  # old Matplotlib so that stays caught. The figure byte comparisons skip here,
  # as they do anywhere the rendering stack differs from the recorded one.
  oldest-supported-matplotlib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install with a pinned old Matplotlib
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "matplotlib==3.9.4"
      - name: Report the rendering stack
        run: python scripts/record_figure_style.py --check || true
      - name: Run tests
        run: pytest
