name: CI

on: push

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check .
      - name: Run tests
        run: pytest

  # The matrix above always resolves the newest Matplotlib, so every job in
  # it shares one rendering stack. This job pins an old Matplotlib so that a
  # version-dependent plotting regression stays caught. (The v0.2 recorded
  # figure-style machinery this job once exercised was removed in the v1.0
  # supersession; figure fidelity is now data-level, per
  # docs/known_limitations.md section 7.)
  oldest-supported-matplotlib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install with a pinned old Matplotlib
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "matplotlib==3.9.4"
      - name: Run tests
        run: pytest
      - name: Figures build under the old Matplotlib
        run: python scripts/make_figures_v1.py
