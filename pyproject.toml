[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "h2star"
version = "0.2.0"
description = "An open, uncertainty-aware materials-to-system model for sorbent-based hydrogen storage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
    "CoolProp",
    "SALib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff==0.15.17",
]
# Needed only to re-execute the notebooks, which the clean-room reproduction in
# manual Part VII requires. Declared rather than left to be improvised, so the
# reproduction instruction is complete.
nb = [
    "nbformat",
    "nbclient",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "validation: gate tests validating physics against reference data or analytic limits",
    "provenance: tests that walk the data/ files for parseability, units and attribution",
]
