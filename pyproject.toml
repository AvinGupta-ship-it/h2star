[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "h2star"
version = "0.1.0"
description = "Hydrogen storage thermodynamics and system modeling toolkit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
    "CoolProp",
    "SALib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff==0.15.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "validation: gate tests validating physics against reference data or analytic limits",
]
